name: Rooms Production Build Qualification
on:
  pull_request:
    paths:
      - "services/gateway/src/call_history/**"
      - "services/gateway/src/room_community/**"
      - "tests/support/room-community-database.ts"
      - "apps/mobile/test/room_invitation_consent_test.dart"
      - "apps/mobile/test/room_invitation_links_test.dart"
      - "apps/mobile/test/room_ownership_transfer_test.dart"
      - "apps/mobile/test/room_moderation_screen_test.dart"
      - "apps/mobile/test/room_invitation_pagination_test.dart"
      - "apps/mobile/test/room_list_search_pagination_test.dart"
      - "services/gateway/src/main.ts"
      - "apps/mobile/lib/src/screens/rooms/**"
      - "apps/mobile/test/features/rooms/**"
      - "adapters/storage/postgres/src/rooms/**"
      - "services/worker/src/**"
      - "packages/rooms/**"
      - "apps/mobile/lib/src/features/rooms/**"
      - "packages/rooms/migrations/**"
      - "adapters/storage/postgres/src/rooms/**"
      - "services/gateway/src/modules/rooms/**"
      - "infra/deployment/gateway/**"
      - ".github/workflows/rooms-production-build.yml"
  push:
    branches: [main]
    paths:
      - "services/gateway/src/call_history/routes.ts"
      - "services/gateway/src/room_community/**"
      - "tests/support/room-community-database.ts"
      - "apps/mobile/test/room_invitation_consent_test.dart"
      - "apps/mobile/test/room_invitation_links_test.dart"
      - "apps/mobile/test/room_ownership_transfer_test.dart"
      - "apps/mobile/test/room_moderation_screen_test.dart"
      - "apps/mobile/test/room_invitation_pagination_test.dart"
      - "apps/mobile/test/room_list_search_pagination_test.dart"
      - "services/gateway/src/main.ts"
      - "apps/mobile/lib/src/screens/rooms/**"
      - "apps/mobile/test/features/rooms/**"
      - "services/worker/src/main.ts"
      - "packages/rooms/**"
      - "adapters/storage/postgres/src/rooms/**"
      - "apps/mobile/lib/src/features/rooms/**"
      - ".github/workflows/rooms-production-build.yml"
permissions:
  contents: read
jobs:
  build-and-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: masanawa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d masanawa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASANAWA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masanawa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "12.8.2"
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build production Gateway and every dependency
        run: pnpm --filter @masanawa/gateway-service... build
      - name: Build production Room worker and every dependency
        run: pnpm --filter @masanawa/worker-service... build
      - name: Gateway Calls and Rooms typed actor/permissions tests
        run: >-
          pnpm exec vitest run
          services/gateway/src/call_history/routes.test.ts
          services/gateway/src/room_community
          services/worker/src/jobs/rooms
          adapters/storage/postgres/src/rooms/teacher_outbox.test.ts
          packages/rooms/src/index.test.ts
      - name: Real PG18 forward-upgrade and Rooms schema readiness
        run: pnpm exec vitest run adapters/storage/postgres/src/home_feed/af00_migrations.integration.test.ts
          adapters/storage/postgres/src/rooms/teacher_outbox.integration.test.ts
      - name: Room invitations and member authorization unit tests
        run: >-
          node --experimental-transform-types --test
          adapters/storage/postgres/src/rooms/membership.test.mjs
      - name: Real PG18 room invitation lifecycle, race and tenant fences
        run: >-
          node --experimental-transform-types --test
          adapters/storage/postgres/src/rooms/membership.integration.test.mjs
      - name: Focused Worker production typing
        run: pnpm --filter @masanawa/worker-service typecheck
  flutter-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Redesigned Rooms create, timeline and account-isolation journeys
        shell: bash
        run: >-
          flutter test --no-pub --reporter expanded
          test/rooms_redesign_root_test.dart
          test/room_invitation_consent_test.dart
          test/room_invitation_links_test.dart
          test/room_ownership_transfer_test.dart
          test/room_moderation_screen_test.dart
          test/room_invitation_pagination_test.dart
          test/room_list_search_pagination_test.dart
          test/rooms_partial_refresh_test.dart
          test/room_community_screen_test.dart
          test/features/rooms/room_discussion_screen_test.dart
          test/room_community_client_test.dart
          test/features/rooms/room_membership_client_test.dart
          test/room_community_client_test.dart
          2>&1 | tee "$RUNNER_TEMP/rooms-flutter.log"
      - name: Expose bounded Flutter failure diagnostics in check annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rooms-flutter.log'
          if path.exists():
              log = re.sub(r'\x1b\[[0-9;]*m', '', path.read_text(errors='replace'))
              lines = log.splitlines()
              # Unit/widget fixtures only; never print environment or credentials.
              text = '\n'.join(lines[-240:])
              for start in range(0, len(text), 3500):
                  part = text[start:start+3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Rooms Flutter diagnostics::' + part)
          PY
      - name: Focused Rooms Dart analysis
        run: >-
          dart analyze lib/src/features/rooms/rooms_screen.dart
          test/room_invitation_consent_test.dart
          lib/src/features/rooms/room_invitation_links.dart
          lib/src/features/rooms/room_ownership_transfer.dart
          lib/src/features/rooms/room_moderation_screen.dart
          test/room_moderation_screen_test.dart
          test/room_invitation_pagination_test.dart
          test/room_list_search_pagination_test.dart
          test/room_ownership_transfer_test.dart
          test/room_invitation_links_test.dart
          lib/src/features/rooms/room_membership_client.dart
          lib/src/features/rooms/room_membership_screen.dart
          lib/src/screens/rooms/rooms_screen.dart
          test/features/rooms/room_membership_client_test.dart
          test/room_community_client_test.dart

