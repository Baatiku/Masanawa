name: Masanawa Web CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/masanawa-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/masanawa-web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and contract checks
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Verify new source has no donor branding
        run: npm run brand:check
      - name: Production build
        run: npm run build
      - name: Cloudflare Workers build
        run: npm run build:cloudflare
      - name: Check Cloudflare prebuilt deployment bundle
        run: npm run deploy:cloudflare -- --dry-run
