name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the APK only on explicit owner request
        type: boolean
        default: false
      build_web:
        description: Build the web artifact on explicit request
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-gradle-repositories
      # Pinned channel on purpose: exact SDK pins rot fast. Pin an exact
      # flutter-version once releases stabilize around this app.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Install
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # Flutter's expanded reporter can print non-BMP characters from
          # multilingual/emoji fixtures. Some hosted Actions runners crash
          # while logging these characters before emitting test diagnostics.
          # Escape only the console stream; keep Flutter's exact exit status.
          flutter test --reporter expanded 2>&1 | python3 -u -c '
          import sys
          for line in sys.stdin.buffer:
              safe = line.decode("utf-8", "backslashreplace").encode("ascii", "backslashreplace").decode("ascii")
              sys.stdout.write(safe)
              sys.stdout.flush()
          ' | tee "$RUNNER_TEMP/mobile-tests.log" || result=$?
          if [ "${result:-0}" -ne 0 ]; then
            # Job logs can be unavailable through the Actions API. Surface the
            # failing test identities as check annotations for bounded repair.
            python3 - "$RUNNER_TEMP/mobile-tests.log" <<'PY'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          indices = [i for i, line in enumerate(lines) if '[E]' in line][:30]
          for index in indices:
              detail = '\n'.join(lines[max(0, index - 35):index + 32])
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter test failure::{detail}')
          PY
            exit "$result"
          fi
      - name: Phone (production APK)
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        run: flutter build apk --release --dart-define=API_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app
      - name: Verify provenance script contracts
        run: node --test ../../scripts/reliability/release-provenance.test.mjs
      - name: Record signed APK identity and checksum
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          node ../../scripts/reliability/release-provenance.mjs \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --pubspec pubspec.yaml --lockfile pubspec.lock \
            --apksigner "$APKSIGNER" \
            --output build/app/outputs/flutter-apk/release-evidence.json
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)
      - name: Web (release)
        if: github.event_name == 'workflow_dispatch' && inputs.build_web == true
        run: flutter build web --release --dart-define=API_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app
      - name: Upload APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-production-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/mobile/build/app/outputs/flutter-apk/release-evidence.json
      - name: Upload web
        if: github.event_name == 'workflow_dispatch' && inputs.build_web == true
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-web
          path: apps/mobile/build/web
