name: DigitalOcean portable pilot

on:
  pull_request:
    paths:
      - .github/workflows/digitalocean-pilot.yml
      - infra/deployment/digitalocean/**
      - infra/deployment/gateway/**
      - infra/deployment/worker/**
      - infra/deployment/ops/**
      - packages/**
      - services/**
      - adapters/**
      - pnpm-lock.yaml
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/digitalocean-pilot.yml
      - infra/deployment/digitalocean/**
      - infra/deployment/gateway/**
      - infra/deployment/worker/**
      - infra/deployment/ops/**
      - packages/**
      - services/**
      - adapters/**
      - pnpm-lock.yaml
      - package.json

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Reject unsafe pilot configuration
        # This script uses Node built-ins only; ubuntu-latest already ships
        # a modern Node runtime, so no setup-node download is necessary.
        run: node --test infra/deployment/digitalocean/preflight.test.mjs infra/deployment/digitalocean/release-origins.test.mjs
      - name: Validate backup script syntax
        run: bash -n infra/deployment/digitalocean/backup.sh
      - name: Normalize all Compose profiles without secrets
        run: >-
          docker compose
          --env-file infra/deployment/digitalocean/.env.example
          --file infra/deployment/digitalocean/compose.yaml
          --profile public --profile worker --profile ops
          config --quiet

  container-build:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build Gateway, Worker and optional web Ops Dockerfiles
        run: >-
          docker compose
          --env-file infra/deployment/digitalocean/.env.example
          --file infra/deployment/digitalocean/compose.yaml
          build gateway worker ops
      - name: Boot migrations and private Ops without package-manager downloads
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          export SMOKE_DIR="$smoke_dir"
          python3 - <<'PYTHON'
          import os, pathlib, secrets
          root = pathlib.Path(os.environ['SMOKE_DIR'])
          password = secrets.token_hex(32)
          runtime = root / 'runtime.env'
          values = {
              'MASANAWA_RUNTIME_ENV_FILE': str(runtime),
              'POSTGRES_DB': 'masanawa_smoke', 'POSTGRES_USER': 'masanawa_smoke',
              'POSTGRES_PASSWORD': password,
              'MASANAWA_GATEWAY_IMAGE': 'masanawa-gateway:pilot',
              'MASANAWA_WORKER_IMAGE': 'masanawa-worker:pilot',
              'MASANAWA_OPS_IMAGE': 'masanawa-ops:pilot',
          }
          for name, entries in [('compose.env', values), ('runtime.env', {
              'MASANAWA_DATABASE_URL': f'postgres://masanawa_smoke:{password}@postgres:5432/masanawa_smoke',
              'COREPACK_ENABLE_NETWORK': '0',
          })]:
              target = root / name
              target.touch(mode=0o600)
              target.write_text(''.join(f'{key}={value}\n' for key, value in entries.items()))
          PYTHON
          compose=(docker compose -p masanawa-runtime-smoke --env-file "$smoke_dir/compose.env" -f infra/deployment/digitalocean/compose.yaml --profile ops)
          # Only this disposable CI project is removed; never use this on a host deployment.
          trap '"${compose[@]}" down --volumes; rm -rf "$smoke_dir"' EXIT
          "${compose[@]}" up -d --no-build --wait --wait-timeout 120 ops
          "${compose[@]}" exec -T ops node --input-type=module -e '
            for (const path of ["/healthz", "/readyz", "/v1/admin/me", "/v1/admin/summary"]) {
              const response = await fetch("http://127.0.0.1:3002" + path);
              const expected = path.startsWith("/v1/") ? 401 : 200;
              if (response.status !== expected) throw new Error(path + ": " + response.status);
              console.log(path + ": " + response.status);
            }'
          "${compose[@]}" run --rm --no-deps migrate | node --input-type=module -e '
            let input = ""; for await (const chunk of process.stdin) input += chunk;
            const result = input.trim().split("\n").map(line => JSON.parse(line)).find(x => x.event === "database.migrations.complete");
            if (!result || result.appliedCount !== 0) throw new Error("Migration replay was not a no-op");'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable main-commit images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # Dedicated package names avoid previously-created, unlinked GHCR
          # packages whose ACLs cannot be repaired by GITHUB_TOKEN alone.
          gateway="ghcr.io/$owner/masanawa-do-pilot-gateway:$GITHUB_SHA"
          worker="ghcr.io/$owner/masanawa-do-pilot-worker:$GITHUB_SHA"
          ops="ghcr.io/$owner/masanawa-do-pilot-ops:$GITHUB_SHA"
          docker tag masanawa-gateway:pilot "$gateway"
          docker tag masanawa-worker:pilot "$worker"
          docker tag masanawa-ops:pilot "$ops"
          docker push "$gateway"
          docker push "$worker"
          docker push "$ops"
