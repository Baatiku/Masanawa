name: Masana Android APK Compilation
on:
  pull_request:
    paths:
      - "apps/mobile/assets/masana/**"
      - "apps/mobile/lib/src/agents/masana_portrait_avatar.dart"
      - "apps/mobile/lib/src/agents/agent_directory.dart"
      - "apps/mobile/lib/src/router/app_router.dart"
      - "apps/mobile/lib/src/screens/chat/ai_chat_screen.dart"
      - "apps/mobile/lib/src/screens/chat/masana_list_screen.dart"
      - "apps/mobile/lib/src/screens/rooms/rooms_screen.dart"
      - "apps/mobile/test/masana_room_link_test.dart"
      - "apps/mobile/pubspec.yaml"
      - "adapters/storage/postgres/src/masana/catalog_lessons.ts"
      - ".github/workflows/masana-android-apk.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/masana-android-apk.yml"
      - "apps/mobile/assets/masana/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/lib/src/agents/agent_directory.dart"
      - "apps/mobile/lib/src/router/app_router.dart"
      - "apps/mobile/lib/src/screens/chat/ai_chat_screen.dart"
      - "apps/mobile/lib/src/screens/chat/masana_list_screen.dart"
      - "apps/mobile/lib/src/screens/rooms/rooms_screen.dart"
      - "apps/mobile/test/masana_room_link_test.dart"
permissions:
  contents: read
jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Verify all 26 packaged persona portraits
        run: flutter test --no-pub test/masana_professional_portraits_test.dart test/agent_directory_readiness_test.dart test/features/rooms/room_auto_answer_test.dart test/masana_room_link_test.dart
      # Independent from the existing whole-project analyzer debt. The
      # Mobile Build workflow still reports those issues and remains required
      # for clean release qualification; this job proves an actual APK.
      - name: Compile Android release APK for handset testing
        run: >-
          flutter build apk --release --no-pub
          --dart-define=API_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app
          --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app
      - name: Inspect APK result
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Verify provenance script contracts
        run: node --test ../../scripts/reliability/release-provenance.test.mjs
      - name: Record signed APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          node ../../scripts/reliability/release-provenance.mjs \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --pubspec pubspec.yaml --lockfile pubspec.lock \
            --apksigner "$APKSIGNER" \
            --output build/app/outputs/flutter-apk/release-evidence.json
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)
      - name: Preserve compiled handset APK
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-26-masana-handset-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/mobile/build/app/outputs/flutter-apk/release-evidence.json
          if-no-files-found: error
          retention-days: 7
