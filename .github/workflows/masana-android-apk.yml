name: Masana Android APK Compilation
on:
  # One requested handset-build qualification. The restricted PR trigger is
  # removed after its artifact is recorded; ordinary PRs do not build APKs.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build an APK explicitly requested by the owner
        type: boolean
        default: false
      publish_release:
        description: Also publish a GitHub prerelease (separate explicit request)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compile-android:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) ||
      (github.event_name == 'pull_request' && github.head_ref == 'feat/oct22-room-voice-apk-qualification')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-gradle-repositories
      - name: Install Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Verify all 26 packaged persona portraits
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter test --no-pub --reporter expanded test/masana_professional_portraits_test.dart test/agent_directory_readiness_test.dart test/room_community_client_test.dart test/masana_room_link_test.dart test/masanawa_light_theme_test.dart test/ui/reduced_motion_theme_test.dart > "$RUNNER_TEMP/flutter-tests.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/flutter-tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/flutter-tests.log" <<'PYLOG'
          import sys
          text = open(sys.argv[1]).read()[-24000:]
          for start in range(0, len(text), 3000):
              chunk = text[start:start + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Flutter test failure::' + chunk)
          PYLOG
          fi
          exit "$result"
      # Independent from the existing whole-project analyzer debt. The
      # Mobile Build workflow still reports those issues and remains required
      # for clean release qualification; this job proves an actual APK.
      - name: Compile Android release APK for handset testing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          # Regenerate release plugin registrants after tests; --no-pub leaves dev-only Patrol registered.
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app \
            --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production-338f.up.railway.app > "$RUNNER_TEMP/flutter-build.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/flutter-build.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/flutter-build.log" <<'PYLOG'
          import sys
          text = open(sys.argv[1]).read()[-24000:]
          for start in range(0, len(text), 3000):
              chunk = text[start:start + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Flutter build failure::' + chunk)
          PYLOG
          fi
          exit "$result"
      - name: Inspect APK result
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Verify provenance script contracts
        run: node --test ../../scripts/reliability/release-provenance.test.mjs
      - name: Record signed APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          trap 'echo "::error title=APK provenance failure::Failed at workflow line $LINENO"' ERR
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          node ../../scripts/reliability/release-provenance.mjs \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --pubspec pubspec.yaml --lockfile pubspec.lock \
            --apksigner "$APKSIGNER" \
            --output build/app/outputs/flutter-apk/release-evidence.json 2> "$RUNNER_TEMP/provenance-error.log" || {
              message="$(cat "$RUNNER_TEMP/provenance-error.log")"
              echo "::error title=APK provenance failure::$message"
              exit 1
            }
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > app-release.apk.sha256)
      - name: Preserve compiled handset APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-26-masana-handset-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/mobile/build/app/outputs/flutter-apk/release-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-handset:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true && inputs.publish_release == true
    needs: compile-android
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: masanawa-26-masana-handset-apk
          path: handset
      - name: Publish downloadable handset test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: handset-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cd handset
          sha256sum --check app-release.apk.sha256
          cat > release-notes.md <<EOF
          Android handset test build from commit ${SOURCE_SHA}.

          Download app-release.apk below. The checksum and signing evidence are attached.
          This build uses development signing and production service URLs. Device, call,
          audio and provider acceptance have not been qualified by this build workflow.
          A different signing certificate may prevent updating an existing installation.
          EOF
          gh release create "$RELEASE_TAG" app-release.apk app-release.apk.sha256 release-evidence.json \
            --target "$SOURCE_SHA" --prerelease \
            --title "Masanawa handset test APK ($RELEASE_TAG)" --notes-file release-notes.md
