name: Chats Visual Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/lib/src/screens/chat/**'
      - 'apps/mobile/lib/src/ui/components/masanawa_conversation_tile.dart'
      - 'apps/mobile/test/chat_visual_matrix_test.dart'
      - 'apps/mobile/test/chat_conversation_visual_matrix_test.dart'
      - '.github/workflows/chats-visual-matrix.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install app dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Render seven first-party Chats baselines
        working-directory: apps/mobile
        run: flutter test --dart-define=CHAT_CAPTURE_GOLDENS=true --update-goldens test/chat_visual_matrix_test.dart test/chat_conversation_visual_matrix_test.dart
      - name: Publish visual baselines for reference review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chats-visual-matrix
          path: apps/mobile/test/goldens/chat_matrix/*.png
          if-no-files-found: warn
