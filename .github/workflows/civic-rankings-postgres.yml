name: Civic rankings PostgreSQL
on:
  pull_request:
    paths:
      - 'services/gateway/src/civic_rating_routes.ts'
      - 'services/gateway/src/civic_rankings.pg.integration.test.ts'
      - 'packages/agents/migrations/**'
      - '.github/workflows/civic-rankings-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'services/gateway/src/civic_rating_routes.ts'
      - 'services/gateway/src/civic_rankings.pg.integration.test.ts'
      - 'packages/agents/migrations/**'
      - '.github/workflows/civic-rankings-postgres.yml'
permissions:
  contents: read
jobs:
  civic-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: masanawa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d masanawa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASANAWA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masanawa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "12.8.2"
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @masanawa/gateway-service... build
      - run: pnpm exec vitest run --no-file-parallelism services/gateway/src/civic_rankings.pg.integration.test.ts services/gateway/src/civic_engagement.test.ts services/gateway/src/civic_rating_routes.test.ts
