name: Kotlin Android Shell

on:
  push:
    paths:
      - 'apps/android-shell/**'
      - '.github/workflows/kotlin-android-shell.yml'
  pull_request:
    paths:
      - 'apps/android-shell/**'
      - '.github/workflows/kotlin-android-shell.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile and test Kotlin Android shell
        working-directory: apps/android-shell
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
