name: Kotlin Android Shell

on:
  push:
    paths:
      - 'apps/android-shell/**'
      - '.github/workflows/kotlin-android-shell.yml'
  pull_request:
    paths:
      - 'apps/android-shell/**'
      - '.github/workflows/kotlin-android-shell.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Android runner already includes cmdline-tools. The legacy
      # setup-android action still installs the removed `tools` SDK package.
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile and test Kotlin Android shell
        working-directory: apps/android-shell
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Publish installable Masanawa APK (debug signed)
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-android-debug-apk
          path: apps/android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
