name: Kotlin Android shell signed release candidate

# Produces a review-only AAB. Never uploads to Play or replaces Flutter.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "New Play version code, greater than the installed Flutter release"
        required: true
        type: number

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Validate owner signing and version gates
        env:
          KEYSTORE_B64: ${{ secrets.SHELL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHELL_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SHELL_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHELL_RELEASE_KEY_ALIAS }}
          EXPECTED_SHA256: ${{ secrets.SHELL_EXPECTED_UPLOAD_SHA256 }}
          SHELL_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" &&
            test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$EXPECTED_SHA256"
          test "$SHELL_RELEASE_VERSION_CODE" -gt 0
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masanawa-shell-upload.jks"
          chmod 600 "$RUNNER_TEMP/masanawa-shell-upload.jks"
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/masanawa-shell-upload.jks" +            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^\s*SHA256: //p' | head -1)"
          test -n "$actual"
          test "${actual//:/}" = "${EXPECTED_SHA256//:/}"
          echo "SHELL_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/masanawa-shell-upload.jks" >> "$GITHUB_ENV"
      - name: Build and verify signed app bundle
        working-directory: apps/android-shell
        env:
          SHELL_RELEASE_STORE_PASSWORD: ${{ secrets.SHELL_RELEASE_STORE_PASSWORD }}
          SHELL_RELEASE_KEY_PASSWORD: ${{ secrets.SHELL_RELEASE_KEY_PASSWORD }}
          SHELL_RELEASE_KEY_ALIAS: ${{ secrets.SHELL_RELEASE_KEY_ALIAS }}
          SHELL_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease :app:lintRelease :app:testReleaseUnitTest
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
      - name: Upload review-only signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-kotlin-shell-signed-candidate
          path: apps/android-shell/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/masanawa-shell-upload.jks" ]; then
            shred -u "$RUNNER_TEMP/masanawa-shell-upload.jks" || true
          fi
