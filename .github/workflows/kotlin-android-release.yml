name: Masanawa Android signed release

# Release Masanawa Android 1.3.4: original branding, launcher badge and official notification icon.
# Produces a signed, installable APK and a Play-ready bundle without publishing
# either to the store. The new package identity is distinct from Flutter.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Masanawa Kotlin release version code (must exceed previous Kotlin release)"
        required: true
        type: number
  # Owner-approved signed release; regular changes cannot trigger signing.
  push:
    branches: [main]
    paths:
      - '.github/workflows/kotlin-android-release.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Masanawa Android'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Validate owner signing and version gates
        env:
          KEYSTORE_B64: ${{ secrets.SHELL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHELL_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SHELL_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHELL_RELEASE_KEY_ALIAS }}
          EXPECTED_SHA256: ${{ secrets.SHELL_EXPECTED_UPLOAD_SHA256 }}
          SHELL_RELEASE_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || 16 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" &&
            test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$EXPECTED_SHA256"
          # Release must supersede the previous Android 1.3.2 candidate (code 15).
          test "$SHELL_RELEASE_VERSION_CODE" -gt 15
          # Accept either the raw Base64 value or a copied .env assignment.
          # Never print signing material; keep invalid inputs failed closed.
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          import sys

          value = os.environ["KEYSTORE_B64"].strip()
          prefix = "SHELL_RELEASE_KEYSTORE_BASE64="
          if value.startswith(prefix):
              value = value[len(prefix):].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
              value = value[1:-1]
          value = "".join(value.split())
          try:
              keystore = base64.b64decode(value, validate=True)
          except (binascii.Error, ValueError):
              sys.exit("Invalid keystore Base64. Re-enter SHELL_RELEASE_KEYSTORE_BASE64 using its value from github-secrets.env, without the NAME= prefix.")
          if not keystore:
              sys.exit("Signing keystore decoded to an empty file.")
          path = Path(os.environ["RUNNER_TEMP"]) / "masanawa-shell-upload.jks"
          path.write_bytes(keystore)
          path.chmod(0o600)
          PY
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/masanawa-shell-upload.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^\s*SHA256: //p' | head -1)"
          test -n "$actual"
          # Accept copied NAME=value, quotation marks, spaces and colons.
          # A different certificate still fails the strict 64-hex comparison.
          expected="$(python3 - <<'PY'
          import os
          import re

          value = os.environ["EXPECTED_SHA256"].strip().strip(chr(39) + chr(34))
          prefix = "SHELL_EXPECTED_UPLOAD_SHA256="
          if value.startswith(prefix):
              value = value[len(prefix):].strip().strip(chr(39) + chr(34))
          if value.upper().startswith("SHA256:"):
              value = value[7:].strip()
          value = "".join(value.split()).replace(":", "").upper()
          if not re.fullmatch(r"[0-9A-F]{64}", value):
              raise SystemExit("Invalid certificate fingerprint format in SHELL_EXPECTED_UPLOAD_SHA256.")
          print(value)
          PY
          )"
          actual="${actual//:/}"
          if [ "${actual^^}" != "$expected" ]; then
            echo "::error::The stored fingerprint does not match the signing keystore. Recheck SHELL_EXPECTED_UPLOAD_SHA256."
            exit 1
          fi
          echo "SHELL_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/masanawa-shell-upload.jks" >> "$GITHUB_ENV"
      - name: Verify no native logo and correct Masanawa launcher
        working-directory: apps/android-shell
        run: |
          set -euo pipefail
          grep -Fq 'windowSplashScreenAnimatedIcon">@android:color/transparent' app/src/main/res/values/styles.xml
          ! grep -Fq 'Masanawa Test' app/build.gradle.kts
          grep -Fq 'resValue("string", "masanawa_app_label", "Masanawa")' app/build.gradle.kts
      - name: Build and verify signed APK and app bundle
        working-directory: apps/android-shell
        env:
          SHELL_RELEASE_STORE_PASSWORD: ${{ secrets.SHELL_RELEASE_STORE_PASSWORD }}
          SHELL_RELEASE_KEY_PASSWORD: ${{ secrets.SHELL_RELEASE_KEY_PASSWORD }}
          SHELL_RELEASE_KEY_ALIAS: ${{ secrets.SHELL_RELEASE_KEY_ALIAS }}
          SHELL_RELEASE_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || 16 }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease :app:testDebugUnitTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          # Android app-signing certificates are self-signed; verify bundle contents without PKIX CA-chain enforcement.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed Masanawa APK
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-android-signed-apk
          path: apps/android-shell/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload review-only signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-android-signed-bundle
          path: apps/android-shell/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/masanawa-shell-upload.jks" ]; then
            shred -u "$RUNNER_TEMP/masanawa-shell-upload.jks" || true
          fi
