name: Checklist Flutter verification (no APK)
on:
  workflow_dispatch:
  push:
    branches: [fix/checklist-implementation-20261019]
    paths: ['apps/mobile/**', '.github/workflows/checklist-verification.yml']
permissions:
  contents: read
jobs:
  flutter-tests:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze errors
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analysis.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/analysis.log"
          python3 - "$RUNNER_TEMP/analysis.log" <<'PY'
          import sys
          for line in open(sys.argv[1]):
              if 'error •' in line or 'error -' in line:
                  print('::error title=Dart analysis::'+line.strip().replace('%','%25'))
          PY
          exit "$result"
      - name: Full Flutter regressions
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter json --timeout 60s > "$RUNNER_TEMP/flutter-tests.jsonl" 2>&1
          result=$?
          python3 - "$RUNNER_TEMP/flutter-tests.jsonl" <<'PY'
          import json,sys,os
          tests={};suites={};owners={};counts={};errors={};printed={};failed=[];raw=[]
          def escape(text): return text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          for line in open(sys.argv[1]):
              try: e=json.loads(line)
              except ValueError:
                  if line.strip(): raw.append(line.strip())
                  continue
              tid=e.get('testID',-1)
              if e.get('type')=='suite':suites[e['suite']['id']]=e['suite'].get('path','unknown')
              if e.get('type')=='testStart':
                  tests[e['test']['id']]=e['test']['name'];owners[e['test']['id']]=e['test'].get('suiteID',-1)
              if e.get('type')=='print':printed[tid]=(printed.get(tid,'')+'\n'+e.get('message',''))[:12000]
              if e.get('type')=='error':errors[tid]=errors.get(tid,'')+'\n'+e.get('error','')+'\n'+e.get('stackTrace','')
              if e.get('type')=='testDone':
                  key='skipped' if e.get('skipped') else e.get('result','unknown');counts[key]=counts.get(key,0)+1
                  if key in ('error','failure'):failed.append(tid)
          print('::notice title=Flutter results::'+json.dumps(counts))
          names='\n'.join('Failed: '+tests.get(t,str(t)) for t in failed)
          if failed: print('::error title=Failed Flutter tests::'+escape(names[:3000]))
          for tid in failed[:8]:
              detail=(printed.get(tid,'')+'\n'+errors.get(tid,''))
              print('::error title=Flutter regression::'+escape((tests.get(tid,str(tid))+'\n'+detail)[:3000]))
          if raw:print('::error title=Flutter runner output::'+escape('\n'.join(raw)[-3000:]))
          grouped={}
          for t in failed:grouped.setdefault(owners.get(t,-1),[]).append(t)
          details=names[:10000]+'\n\n'+'\n\n'.join(suites.get(s,'unknown')+'\n'+tests.get(t,str(t))+'\n'+printed.get(t,'')[:1800]+'\n'+errors.get(t,'')[:300] for s,ts in grouped.items() for t in ts[:2])
          payload={'name':'Flutter regression details','head_sha':os.environ['SOURCE_SHA'],'status':'completed','conclusion':'failure' if failed or not counts else 'success','output':{'title':'Full Flutter results','summary':json.dumps(counts),'text':details[:60000] or '\n'.join(raw)[-60000:] or 'All executed tests passed.'}}
          with open(os.path.join(os.environ['RUNNER_TEMP'],'flutter-check.json'),'w') as f:json.dump(payload,f)
          PY
          gh api --method POST "repos/$GH_REPO/check-runs" --input "$RUNNER_TEMP/flutter-check.json" --silent || echo '::warning::Could not save extended Flutter test report'
          exit "$result"
