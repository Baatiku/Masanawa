name: Publish existing handset APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android APK build run in this repository
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve original source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          python3 - <<'PY'
          import json, os, re
          run=json.load(open('run.json'))
          assert run['repository']['full_name'].lower()==os.environ['GH_REPO'].lower()
          assert run['name']=='Masana Android APK Compilation'
          assert run['status']=='completed'
          assert re.fullmatch('[0-9a-f]{40}',run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: masanawa-26-masana-handset-apk
          path: handset
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_RUN: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd handset
          test -s app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app-release.apk > signature-verification.txt
          sha256sum app-release.apk > app-release.apk.sha256
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('app-release.apk')
          json.dump({'gitCommit':os.environ['SOURCE_SHA'],'buildRun':os.environ['BUILD_RUN'],'artifact':{'filename':apk.name,'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'signatureVerified':True},'signatureEvidence':'signature-verification.txt','productionQualified':False,'acceptance':'NOT_RUN'},open('release-evidence.json','w'),indent=2)
          PY
          printf 'Handset test APK from source %s, build run %s. Android signature verified; checksum and full signer report attached. Development signing. Device, calls and provider acceptance remain unverified.\n' "$SOURCE_SHA" "$BUILD_RUN" > release-notes.md
          gh release create "handset-recovered-$BUILD_RUN" app-release.apk app-release.apk.sha256 signature-verification.txt release-evidence.json --target "$SOURCE_SHA" --prerelease --title 'Masanawa handset APK' --notes-file release-notes.md
