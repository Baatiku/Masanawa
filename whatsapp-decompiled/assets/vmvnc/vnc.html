<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Never send a Referer (which would carry this page's URL) to any subresource. -->
  <meta name="referrer" content="no-referrer">
  <title>VM Browser</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Transparent so the app background shows through during connect (before noVNC paints its
         own #screen background) instead of a white/black frame. */
      background: transparent;
      overflow: hidden;
    }
    /* Fill the WebView viewport via fixed insets. A `height: 100%` chain collapses to 0 height in
       the Android WebView, which sizes the noVNC canvas to 0x0 and renders black. */
    #screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <div id="screen"></div>
  <script src="novnc-rfb.js"></script>
  <script>
    (function() {
      // ---- Bridged WebSocket -------------------------------------------------------------------
      // The websockify endpoint now requires `Authorization: Bearer <jwt>`, which a WebView
      // WebSocket cannot set (no custom handshake headers in JS). So native code
      // (BrowserSessionController) owns the real socket — opened over Tigon with the VM bearer —
      // and this shim relays RFB frames over the AndroidVncBridge JS interface. noVNC is unaware:
      // it constructs `new WebSocket(...)` (this class) and talks to it like a normal socket.
      //
      // noVNC's Websock.attach() requires the channel expose these as *own* properties:
      // send, close, binaryType, onerror, onmessage, onopen, protocol, readyState — so everything
      // below is assigned on the instance, not the prototype.
      function bytesToBase64(bytes) {
        var CHUNK = 0x8000;
        var binary = '';
        for (var i = 0; i < bytes.length; i += CHUNK) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
        }
        return btoa(binary);
      }
      function base64ToArrayBuffer(b64) {
        var binary = atob(b64);
        var len = binary.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }
      function base64ToUtf8(b64) {
        var binary = atob(b64);
        var len = binary.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        if (window.TextDecoder) {
          return new TextDecoder('utf-8').decode(bytes);
        }
        var escaped = '';
        for (var j = 0; j < bytes.length; j++) {
          escaped += '%' + ('00' + bytes[j].toString(16)).slice(-2);
        }
        return decodeURIComponent(escaped);
      }

      function BridgedWebSocket(url, protocols) {
        var self = this;
        this.binaryType = 'arraybuffer';
        this.protocol = (protocols && protocols.length) ? protocols[0] : '';
        this.readyState = BridgedWebSocket.CONNECTING;
        this.onopen = null;
        this.onmessage = null;
        this.onclose = null;
        this.onerror = null;

        this.send = function(data) {
          var bytes;
          if (data instanceof ArrayBuffer) {
            bytes = new Uint8Array(data);
          } else if (data && data.buffer) {
            bytes = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
          } else {
            return;
          }
          try { window.AndroidVncBridge.socketSend(bytesToBase64(bytes)); } catch (e) {}
        };
        this.close = function() {
          if (self.readyState === BridgedWebSocket.CLOSED) { return; }
          self.readyState = BridgedWebSocket.CLOSING;
          try { window.AndroidVncBridge.socketClose(); } catch (e) {}
        };

        // Internal transitions, driven by the native callbacks below.
        this._opened = function(protocol) {
          if (protocol) { self.protocol = protocol; }
          self.readyState = BridgedWebSocket.OPEN;
          if (self.onopen) { self.onopen({}); }
        };
        this._message = function(arrayBuffer) {
          if (self.onmessage) { self.onmessage({ data: arrayBuffer }); }
        };
        this._closed = function(code, reason) {
          if (self.readyState === BridgedWebSocket.CLOSED) { return; }
          self.readyState = BridgedWebSocket.CLOSED;
          if (self.onclose) { self.onclose({ code: code, reason: reason || '' }); }
        };
        this._failed = function() {
          if (self.onerror) { self.onerror({}); }
          self._closed(1006, '');
        };

        // noVNC opens exactly one socket; expose it for the native callbacks.
        window.__vncSocket = this;
        try {
          window.AndroidVncBridge.socketOpen();
        } catch (e) {
          setTimeout(function() { self._failed(); }, 0);
        }
      }
      BridgedWebSocket.CONNECTING = 0;
      BridgedWebSocket.OPEN = 1;
      BridgedWebSocket.CLOSING = 2;
      BridgedWebSocket.CLOSED = 3;

      // Native -> JS entry points (invoked via WebView.evaluateJavascript).
      window.__vncBridge = {
        onOpen: function(protocol) {
          var s = window.__vncSocket; if (s) { s._opened(protocol); }
        },
        onMessage: function(b64) {
          var s = window.__vncSocket; if (s) { s._message(base64ToArrayBuffer(b64)); }
        },
        onClose: function(code, reason) {
          var s = window.__vncSocket; if (s) { s._closed(code, reason); }
        },
        onError: function() {
          var s = window.__vncSocket; if (s) { s._failed(); }
        }
      };

      window.WebSocket = BridgedWebSocket;

      // ---- noVNC setup -------------------------------------------------------------------------
      var RFB = window.__noVNC && window.__noVNC.default;
      if (!RFB) {
        document.body.innerText = 'noVNC bundle failed to load';
        return;
      }

      // The URL is irrelevant — the bridged socket ignores it and native builds the real
      // websockify URL. `binary` is the subprotocol the server requires (native re-sends it).
      var rfb = new RFB(document.getElementById('screen'), 'wss://bridge.invalid/', {
        wsProtocols: ['binary'],
      });
      var viewOnly = true;
      try {
        viewOnly = !!window.AndroidVncBridge.isViewOnly();
      } catch (e) {}
      var inputEnabled = false;
      try {
        inputEnabled = !!window.AndroidVncBridge.isInputEnabled();
      } catch (e) {}
      rfb.viewOnly = viewOnly || !inputEnabled;
      var coverViewportEnabled = viewOnly;
      var requestedPanModeEnabled = false;
      var panModeEnabled = viewOnly;
      var zoomMultiplier = 1;
      var maxViewportScale = 3;
      var unobscuredViewportAspectRatio = 0;
      var panModeDragActive = false;
      var panModeDragLastX = 0;
      var panModeDragLastY = 0;
      var panModeRemoteScrollActive = false;
      var panModeRemoteScrollMagnitudeX = 0;
      var panModeRemoteScrollMagnitudeY = 0;
      var panModePinchActive = false;
      var panModePinchStartMagnitude = 0;
      var panModePinchStartZoomMultiplier = 1;
      var panModePinchAnchor = null;
      try {
        coverViewportEnabled = viewOnly || !!window.AndroidVncBridge.isCoverViewportEnabled();
      } catch (e) {}
      try {
        requestedPanModeEnabled = !!window.AndroidVncBridge.isPanModeEnabled();
        panModeEnabled = viewOnly || requestedPanModeEnabled;
      } catch (e) {}
      try {
        if (!viewOnly) {
          zoomMultiplier = Math.max(1, Math.min(3, window.AndroidVncBridge.getZoomMultiplier()));
        }
      } catch (e) {}
      try {
        var aspect = Number(window.AndroidVncBridge.getUnobscuredViewportAspectRatio());
        if (Number.isFinite(aspect) && aspect > 0) {
          unobscuredViewportAspectRatio = aspect;
        }
      } catch (e) {}
      rfb.scaleViewport = !usesViewportZoom();
      rfb.clipViewport = usesViewportZoom();
      rfb.dragViewport = usesViewportZoom() && panModeEnabled;
      rfb.resizeSession = false;
      // noVNC paints #screen rgb(40, 40, 40) by default, which shows as a grey slab wherever the
      // fitted canvas does not reach. Let the app background show through instead.
      rfb.background = 'transparent';

      function usesViewportZoom() {
        return coverViewportEnabled;
      }

      function redrawViewport() {
        var display = rfb && rfb._display;
        if (!display || !display._viewportLoc || !display._targetCtx || !display._backbuffer) {
          return;
        }
        var viewport = display._viewportLoc;
        var visibleWidth = Math.min(viewport.w, Math.max(0, display._fbWidth - viewport.x));
        var visibleHeight = Math.min(viewport.h, Math.max(0, display._fbHeight - viewport.y));
        display._targetCtx.clearRect(0, 0, display._target.width, display._target.height);
        if (visibleWidth > 0 && visibleHeight > 0) {
          display._targetCtx.drawImage(
            display._backbuffer,
            viewport.x,
            viewport.y,
            visibleWidth,
            visibleHeight,
            0,
            0,
            visibleWidth,
            visibleHeight,
          );
        }
      }

      function panViewportBy(deltaX, deltaY) {
        var display = rfb && rfb._display;
        if (!display || !display._viewportLoc) {
          return { x: 0, y: 0 };
        }
        var viewport = display._viewportLoc;
        var maxX = Math.max(0, display._fbWidth - viewport.w);
        var maxY = Math.max(0, display._fbHeight - viewport.h);
        var requestedX = viewport.x + deltaX;
        var requestedY = viewport.y + deltaY;
        var overflowX = requestedX < 0 ? requestedX : Math.max(0, requestedX - maxX);
        var overflowY = requestedY < 0 ? requestedY : Math.max(0, requestedY - maxY);
        var nextX = Math.min(maxX, Math.max(0, Math.round(requestedX)));
        var nextY = Math.min(maxY, Math.max(0, Math.round(requestedY)));
        if (nextX === viewport.x && nextY === viewport.y) {
          return { x: overflowX, y: overflowY };
        }
        viewport.x = nextX;
        viewport.y = nextY;
        redrawViewport();
        return { x: overflowX, y: overflowY };
      }

      function dispatchRemoteScrollGesture(type, clientX, clientY) {
        rfb._canvas.dispatchEvent(new CustomEvent(type, {
          detail: {
            type: 'twodrag',
            clientX: clientX,
            clientY: clientY,
            magnitudeX: panModeRemoteScrollMagnitudeX,
            magnitudeY: panModeRemoteScrollMagnitudeY,
          },
        }));
      }

      function scrollRemoteBy(clientX, clientY, deltaX, deltaY) {
        if (!canSendRemoteInput() || (deltaX === 0 && deltaY === 0)) {
          return;
        }
        if (!panModeRemoteScrollActive) {
          panModeRemoteScrollActive = true;
          panModeRemoteScrollMagnitudeX = 0;
          panModeRemoteScrollMagnitudeY = 0;
          dispatchRemoteScrollGesture('gesturestart', clientX, clientY);
        }
        panModeRemoteScrollMagnitudeX += deltaX;
        panModeRemoteScrollMagnitudeY += deltaY;
        dispatchRemoteScrollGesture('gesturemove', clientX, clientY);
      }

      function endRemoteScroll(clientX, clientY) {
        if (!panModeRemoteScrollActive) {
          return;
        }
        dispatchRemoteScrollGesture('gestureend', clientX, clientY);
        panModeRemoteScrollActive = false;
      }

      function handlePanModeDrag(event) {
        if (
          (!panModeDragActive && (!coverViewportEnabled || !panModeEnabled)) ||
          !event.detail ||
          event.detail.type !== 'drag'
        ) {
          return;
        }
        event.stopImmediatePropagation();
        event.preventDefault();
        if (event.type === 'gesturestart') {
          panModeDragActive = true;
          panModeDragLastX = event.detail.clientX;
          panModeDragLastY = event.detail.clientY;
        } else if (event.type === 'gesturemove' && panModeDragActive) {
          var display = rfb && rfb._display;
          var scale = display && display.scale ? display.scale : 1;
          var overflow = panViewportBy(
            (panModeDragLastX - event.detail.clientX) / scale,
            (panModeDragLastY - event.detail.clientY) / scale,
          );
          scrollRemoteBy(
            event.detail.clientX,
            event.detail.clientY,
            -overflow.x * scale,
            -overflow.y * scale,
          );
          panModeDragLastX = event.detail.clientX;
          panModeDragLastY = event.detail.clientY;
        } else if (event.type === 'gestureend') {
          endRemoteScroll(event.detail.clientX, event.detail.clientY);
          panModeDragActive = false;
        }
      }

      rfb._canvas.addEventListener('gesturestart', handlePanModeDrag, true);
      rfb._canvas.addEventListener('gesturemove', handlePanModeDrag, true);
      rfb._canvas.addEventListener('gestureend', handlePanModeDrag, true);

      function handlePanModePinch(event) {
        if (
          (!panModePinchActive && (!coverViewportEnabled || !panModeEnabled)) ||
          !event.detail ||
          event.detail.type !== 'pinch'
        ) {
          return;
        }
        event.stopImmediatePropagation();
        event.preventDefault();
        var magnitude = Math.hypot(event.detail.magnitudeX, event.detail.magnitudeY);
        if (event.type === 'gesturestart') {
          panModePinchActive = true;
          panModePinchStartMagnitude = magnitude;
          panModePinchStartZoomMultiplier = zoomMultiplier;
          panModePinchAnchor = viewportZoomAnchor(event.detail.clientX, event.detail.clientY);
        } else if (event.type === 'gesturemove' && panModePinchStartMagnitude > 0) {
          setZoomMultiplier(
            panModePinchStartZoomMultiplier * magnitude / panModePinchStartMagnitude,
            panModePinchAnchor,
          );
        } else if (event.type === 'gestureend') {
          panModePinchActive = false;
          panModePinchStartMagnitude = 0;
          panModePinchAnchor = null;
        }
      }

      rfb._canvas.addEventListener('gesturestart', handlePanModePinch, true);
      rfb._canvas.addEventListener('gesturemove', handlePanModePinch, true);
      rfb._canvas.addEventListener('gestureend', handlePanModePinch, true);

      function notify(event, detail) {
        if (window.AndroidVncBridge && typeof window.AndroidVncBridge[event] === 'function') {
          window.AndroidVncBridge[event](detail || '');
        }
      }

      function setCanvasAlignment(scale, rect, display) {
        try {
          var canvas = document.querySelector('#screen canvas');
          if (rfb && rfb._screen) {
            rfb._screen.style.justifyContent = display.width * scale <= rect.width
              ? 'center'
              : 'flex-start';
            rfb._screen.style.alignItems = display.height * scale <= rect.height
              ? 'center'
              : 'flex-start';
            rfb._screen.style.overflow = 'hidden';
          }
          if (canvas) {
            canvas.style.margin = '0';
            canvas.style.display = 'block';
          }
        } catch (e) {}
      }

      function setCanvasFitCentered() {
        try {
          var canvas = document.querySelector('#screen canvas');
          if (rfb && rfb._screen) {
            rfb._screen.style.justifyContent = '';
            rfb._screen.style.alignItems = '';
            rfb._screen.style.overflow = 'auto';
          }
          if (canvas) {
            canvas.style.margin = 'auto';
            canvas.style.display = '';
          }
        } catch (e) {}
      }

      function viewportScaleBounds() {
        var display = rfb && rfb._display;
        if (!display || display.width <= 0 || display.height <= 0) {
          return null;
        }
        var screen = document.getElementById('screen');
        var rect = screen.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) {
          return null;
        }
        // The keyboard clips the visible viewport without changing the page's fitted scale.
        var fitHeight = unobscuredViewportAspectRatio > 0
          ? rect.width / unobscuredViewportAspectRatio
          : rect.height;
        var fitScale = Math.min(rect.width / display.width, fitHeight / display.height, 1);
        return {
          display: display,
          rect: rect,
          fitScale: fitScale,
          maxZoomMultiplier: Math.max(1, maxViewportScale / fitScale),
        };
      }

      function applyViewportScale(resetToTopLeft, anchor) {
        if (!usesViewportZoom()) {
          return;
        }
        try {
          var bounds = viewportScaleBounds();
          if (!bounds) {
            return;
          }
          var display = bounds.display;
          var rect = bounds.rect;
          zoomMultiplier = Math.max(1, Math.min(bounds.maxZoomMultiplier, zoomMultiplier));
          var scale = bounds.fitScale * zoomMultiplier;
          var viewportWidth = Math.ceil(rect.width / scale);
          var viewportHeight = Math.ceil(rect.height / scale);
          display.clipViewport = true;
          display.viewportChangeSize(viewportWidth, viewportHeight);
          if (resetToTopLeft && display._viewportLoc) {
            display.viewportChangePos(-display._viewportLoc.x, -display._viewportLoc.y);
          }
          display.scale = scale;
          setCanvasAlignment(scale, rect, display);
          if (anchor) {
            var canvasRect = rfb._canvas.getBoundingClientRect();
            var viewport = display._viewportLoc;
            display.viewportChangePos(
              Math.round(anchor.x - (anchor.clientX - canvasRect.left) / scale) - viewport.x,
              Math.round(anchor.y - (anchor.clientY - canvasRect.top) / scale) - viewport.y,
            );
          }
        } catch (e) {}
      }

      function scheduleViewportScale(resetToTopLeft, anchor) {
        if (!usesViewportZoom()) {
          return;
        }
        var scheduledZoomMultiplier = zoomMultiplier;
        window.requestAnimationFrame(function() {
          if (zoomMultiplier !== scheduledZoomMultiplier) { return; }
          applyViewportScale(resetToTopLeft, anchor);
          setTimeout(function() {
            if (zoomMultiplier === scheduledZoomMultiplier) {
              applyViewportScale(false);
            }
          }, 0);
        });
      }

      function applyFitScale() {
        try {
          rfb.scaleViewport = true;
          rfb.clipViewport = false;
          rfb.dragViewport = false;
          setCanvasFitCentered();
          if (rfb._display) {
            rfb._display.clipViewport = false;
          }
          if (typeof rfb._updateClip === 'function') {
            rfb._updateClip();
          }
          if (typeof rfb._updateScale === 'function') {
            rfb._updateScale();
          }
        } catch (e) {}
      }

      function applyViewportMode(resetToTopLeft) {
        if (usesViewportZoom()) {
          rfb.scaleViewport = false;
          rfb.clipViewport = true;
          rfb.dragViewport = panModeEnabled;
          scheduleViewportScale(resetToTopLeft);
        } else {
          applyFitScale();
        }
      }

      function setCoverViewportEnabled(enabled) {
        var nextEnabled = viewOnly || !!enabled;
        if (viewOnly && coverViewportEnabled === nextEnabled) {
          return;
        }
        coverViewportEnabled = nextEnabled;
        applyViewportMode(true);
      }

      function setUnobscuredViewportAspectRatio(aspect) {
        aspect = Number(aspect);
        unobscuredViewportAspectRatio = Number.isFinite(aspect) && aspect > 0 ? aspect : 0;
        scheduleViewportScale(false);
      }

      function setPanModeEnabled(enabled) {
        requestedPanModeEnabled = !!enabled;
        panModeEnabled = viewOnly || requestedPanModeEnabled;
        if (!panModeEnabled) {
          endRemoteScroll(panModeDragLastX, panModeDragLastY);
          panModeDragActive = false;
        }
        rfb.dragViewport = usesViewportZoom() && panModeEnabled;
      }

      function viewportZoomAnchor(clientX, clientY) {
        var bounds = viewportScaleBounds();
        if (!bounds || bounds.display.scale <= 0) {
          return null;
        }
        var canvasRect = rfb._canvas.getBoundingClientRect();
        var viewport = bounds.display._viewportLoc;
        var anchorClientX = Number.isFinite(clientX)
          ? clientX
          : bounds.rect.left + bounds.rect.width / 2;
        var anchorClientY = Number.isFinite(clientY)
          ? clientY
          : bounds.rect.top + bounds.rect.height / 2;
        return {
          x: viewport.x + (anchorClientX - canvasRect.left) / bounds.display.scale,
          y: viewport.y + (anchorClientY - canvasRect.top) / bounds.display.scale,
          clientX: anchorClientX,
          clientY: anchorClientY,
        };
      }

      function setZoomMultiplier(multiplier, anchor) {
        var bounds = viewportScaleBounds();
        // Keep a pinch's original framebuffer point fixed; other zoom commands use the center.
        anchor = anchor || viewportZoomAnchor();
        var maximum = bounds ? bounds.maxZoomMultiplier : 3;
        zoomMultiplier = Math.max(1, Math.min(maximum, Number(multiplier) || 1));
        scheduleViewportScale(false, anchor);
      }

      function sendKeysym(keysym) {
        if (!canSendRemoteInput()) { return; }
        try {
          rfb.focus();
          rfb.sendKey(keysym);
        } catch (e) {}
      }

      function typeText(text) {
        if (!canSendRemoteInput()) { return; }
        for (var i = 0; i < text.length;) {
          var codepoint = text.codePointAt(i);
          i += codepoint > 0xffff ? 2 : 1;
          if (codepoint === 10) {
            sendKeysym(0xff0d);
          } else if (codepoint === 9) {
            sendKeysym(0xff09);
          } else if (codepoint === 8) {
            sendKeysym(0xff08);
          } else {
            sendKeysym(codepoint <= 0x7f ? codepoint : 0x01000000 + codepoint);
          }
        }
      }

      function typeBase64Text(b64) {
        typeText(base64ToUtf8(b64));
      }

      function utf8ToBase64(text) {
        return bytesToBase64(new TextEncoder().encode(text));
      }

      function pasteBase64Text(b64) {
        if (!canSendRemoteInput()) { return; }
        try {
          rfb.focus();
          rfb.clipboardPasteFrom(base64ToUtf8(b64));
        } catch (e) {}
      }

      var copyRequested = false;

      function copySelection() {
        if (!canSendRemoteInput()) { return; }
        copyRequested = true;
        setTimeout(function() { copyRequested = false; }, 3000);
        try {
          rfb.focus();
          rfb.sendKey(0xffe3, 'ControlLeft', true);
          rfb.sendKey(0x0063, 'KeyC', true);
          rfb.sendKey(0x0063, 'KeyC', false);
          rfb.sendKey(0xffe3, 'ControlLeft', false);
        } catch (e) {
          copyRequested = false;
        }
      }

      rfb.addEventListener('clipboard', function(e) {
        try {
          if (!canSendRemoteInput() || !copyRequested) { return; }
          var text = e && e.detail && e.detail.text;
          if (text) {
            copyRequested = false;
            notify('onClipboard', utf8ToBase64(text));
          }
        } catch (err) {}
      });

      function canSendRemoteInput() {
        return !viewOnly && inputEnabled;
      }

      function releasePressedInputs() {
        // noVNC sets viewOnly before ungrabbing its keyboard, which suppresses key-up packets.
        // Release while input is still allowed so the retained stream has no stuck keys/buttons.
        try {
          rfb._keyboard._allKeysUp();
        } catch (e) {
          console.warn('Failed to release remote keyboard input');
        }
        try {
          if (rfb._mouseButtonMask) {
            var position = rfb._mousePos;
            rfb._sendMouse(Number(position.x) || 0, Number(position.y) || 0, 0);
          }
        } catch (e) {
          console.warn('Failed to release remote mouse buttons');
        }
      }

      function clearInteractionGestures() {
        if (rfb._mouseMoveTimer !== null) {
          clearTimeout(rfb._mouseMoveTimer);
          rfb._mouseMoveTimer = null;
        }
        rfb._mouseButtonMask = 0;
        panModeDragActive = false;
        panModePinchActive = false;
        panModePinchStartMagnitude = 0;
        panModePinchAnchor = null;
        panModeRemoteScrollActive = false;
        panModeRemoteScrollMagnitudeX = 0;
        panModeRemoteScrollMagnitudeY = 0;
        copyRequested = false;
        rfb._viewportDragging = false;
        rfb._viewportHasMoved = false;
        rfb._accumulatedWheelDeltaX = 0;
        rfb._accumulatedWheelDeltaY = 0;
      }

      function setInteractionState(nextViewOnly, enabled) {
        nextViewOnly = !!nextViewOnly;
        var nextInputEnabled = !nextViewOnly && !!enabled;
        var modeChanged = viewOnly !== nextViewOnly;
        var disablingInput = canSendRemoteInput() && !nextInputEnabled;
        if (disablingInput) {
          releasePressedInputs();
        }
        viewOnly = nextViewOnly;
        inputEnabled = nextInputEnabled;
        rfb.viewOnly = !canSendRemoteInput();
        if (modeChanged || disablingInput) {
          clearInteractionGestures();
        }
        if (modeChanged) {
          panModeEnabled = viewOnly || requestedPanModeEnabled;
          applyViewportMode(false);
        }
      }

      function setInputEnabled(enabled) {
        setInteractionState(viewOnly, enabled);
      }

      window.__vncBridge.setInteractionState = setInteractionState;
      window.__vncBridge.setCoverViewportEnabled = setCoverViewportEnabled;
      window.__vncBridge.setUnobscuredViewportAspectRatio = setUnobscuredViewportAspectRatio;
      window.__vncBridge.setPanModeEnabled = setPanModeEnabled;
      window.__vncBridge.setZoomMultiplier = setZoomMultiplier;
      window.__vncBridge.copySelection = copySelection;
      window.__vncBridge.sendSpecialKey = sendKeysym;
      window.__vncBridge.typeBase64Text = typeBase64Text;
      window.__vncBridge.pasteBase64Text = pasteBase64Text;

      var coverResizeObserver = null;
      if (window.ResizeObserver) {
        try {
          coverResizeObserver = new ResizeObserver(function() { scheduleViewportScale(false); });
          coverResizeObserver.observe(document.getElementById('screen'));
        } catch (e) {}
      }
      window.addEventListener('resize', function() { scheduleViewportScale(false); });

      // noVNC 1.5 routes ServerInit and both desktop-size encodings through _resize, but does not
      // emit a public resize event. Canvas dimensions can instead describe the clipped viewport.
      var resizeFramebuffer = rfb._resize;
      rfb._resize = function() {
        var result = resizeFramebuffer.apply(this, arguments);
        if (usesViewportZoom()) {
          applyViewportScale(false);
          scheduleViewportScale(false);
        } else {
          applyFitScale();
        }
        return result;
      };

      var decodedPixelUpdate = false;
      var firstFrameScheduled = false;
      var connected = false;
      var handleDataRect = rfb._handleDataRect;
      rfb._handleDataRect = function() {
        var complete = handleDataRect.apply(this, arguments);
        if (complete && this._FBU.width > 0 && this._FBU.height > 0) {
          decodedPixelUpdate = true;
        }
        return complete;
      };
      var framebufferUpdate = rfb._framebufferUpdate;
      rfb._framebufferUpdate = function() {
        var complete = framebufferUpdate.apply(this, arguments);
        if (complete && decodedPixelUpdate && !firstFrameScheduled) {
          firstFrameScheduled = true;
          // Image rectangles can finish decoding after the FBU packet is parsed. Flush also waits
          // for its queued flip; the second animation frame follows a canvas paint opportunity.
          this._display.flush().then(function() {
            window.requestAnimationFrame(function() {
              window.requestAnimationFrame(function() {
                if (connected) {
                  try { window.AndroidVncBridge.onFirstFrame(); } catch (e) {}
                }
              });
            });
          });
        }
        return complete;
      };

      // Recovery mirrors web: reconnect is event-driven on the RFB 'disconnect' (handled natively in
      // BrowserSessionController, which reloads this page → fresh RFB → fresh native socket).
      rfb.addEventListener('connect', function() {
        connected = true;
        applyViewportMode(true);
        notify('onConnected');
      });
      rfb.addEventListener('disconnect', function(e) {
        connected = false;
        setInputEnabled(false);
        notify('onDisconnected', (e && e.detail && e.detail.reason) || '');
      });
      rfb.addEventListener('securityfailure', function(e) {
        connected = false;
        setInputEnabled(false);
        notify('onSecurityFailure', (e && e.detail && e.detail.reason) || '');
      });
    })();
  </script>
</body>
</html>
