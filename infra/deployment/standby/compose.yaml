# Portable, manually activated Gateway standby. No auto migration, no DNS cutover.
# Compose file is deployed on an independent 2+ GiB host, not a Higgsfield sandbox.
name: masanawa-standby
services:
  gateway:
    build:
      context: ../../..
      dockerfile: infra/deployment/gateway/Dockerfile
    command: ["pnpm", "--filter", "@masanawa/gateway-service", "start"]
    env_file:
      - ${MASANAWA_STANDBY_ENV_FILE:?Set an absolute path to an owner-controlled external secret file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      MASANAWA_GATEWAY_HOST: 0.0.0.0
      MASANAWA_GATEWAY_PORT: "3000"
    ports:
      - "127.0.0.1:${MASANAWA_STANDBY_LOCAL_PORT:-3100}:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz', {signal: AbortSignal.timeout(4000)}).then(async r => {const x = await r.json(); if (!r.ok || x.status !== 'ready' || (Array.isArray(x.checks) && x.checks.some(c => c.ready !== true))) process.exit(1)}).catch(() => process.exit(1))"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
