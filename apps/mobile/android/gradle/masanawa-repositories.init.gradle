// Flutter's included Gradle build needs Maven Central for transitive Kotlin
// artifacts; the plugin portal alone does not host every BOM/runtime artifact.
settingsEvaluated { settings ->
    settings.pluginManagement.repositories {
        // Google Cloud's documented Maven Central mirror avoids the CI
        // network's intermittent GitHub release redirect gateway failures.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
            mavenCentral()
            google()
            gradlePluginPortal()
        }
    }
}
