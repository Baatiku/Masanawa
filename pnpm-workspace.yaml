packages:
  - "packages/*"
  - "services/*"
  - "apps/*"
  - "adapters/*/*"
  - "infra/*/*"

allowBuilds:
  '@whiskeysockets/baileys': true
  protobufjs: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/runtime-types@0.1.14"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.3"
  - "@cloudflare/workers-response-store@1.1.2"
  - "@vinext/cloudflare@1.2.0"
  - cf@1.0.0-beta.20
  - miniflare@5.20261019.1-beta
  - vinext@1.3.0

patchedDependencies:
  '@whiskeysockets/baileys@7.0.0-rc14': patches/@whiskeysockets__baileys@7.0.0-rc14.patch
  whatsapp-rust-bridge@0.5.4: patches/whatsapp-rust-bridge@0.5.4.patch
